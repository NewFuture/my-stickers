# Front Build and Deploy (Release to Blob and Static Web Apps)

name: front-end-build-deploy
on:
    push:
        branches: ["v2"]
        paths:
            - ".github/workflows/fe-cd.yml"
            - "client-config-app/**"
            - "manifest/**"
            - "official-stickers/**"
            - "website/**"

permissions:
    contents: read

env:
    WEBSITE: sticker.newfuture.cc
    REACT_APP_API_ROOT: https://stickers-api.newfuture.cc
    REACT_APP_AAD_ID: 695d3f13-6131-4224-aacd-26c8aff039d2
    APP_PRE_FIX: ""

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

jobs:
    front-end-build:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        env:
            NODE_ENV: production
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  cache: yarn
                  node-version: 18

            - run: yarn

            - run: yarn manifest
            - run: yarn stickers
            - run: yarn client:build
            - run: yarn website:build

            # Upload build result
            - uses: actions/upload-artifact@v4
              with:
                  name: front-end
                  path: |
                      website/build/
                      client-config-app/build/
                      manifest/build/
                      official-stickers/build/
                  retention-days: 10

    front-end-deploy:
        needs: [front-end-build]
        environment:
            name: Production
            url: https://${{env.WEBSITE}}/
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/download-artifact@v4.1.7
              with:
                  name: front-end
                  path: ./

            - run: |
                  mv website/build ./www \
                  && mv manifest/build/* ./www/ \
                  && mv client-config-app/build ./www/config \
                  && mv official-stickers/build ./www/official-stickers

            - name: "Stage production video"
              run: |
                  mkdir -p ./www/video \
                  && curl --fail --location --retry 3 \
                      --output ./www/video/my-stickers-v2.mp4 \
                      https://stickersblob.z11.web.core.windows.net/video/my-stickers-v2.mp4

            - name: "Upload to blob storage"
              uses: azure/CLI@v1
              with:
                  inlineScript: |
                      az storage blob upload-batch \
                      --source ./www/ \
                      --destination '$web' \
                      --connection-string "${{secrets.BLOB_CONNECTION_STRING}}" \
                      --overwrite

            # https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-static-site-github-actions?tabs=userlevel
            - name: Azure Login
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
            - name: "Get Static Web Apps deployment token"
              uses: azure/CLI@v2
              with:
                  inlineScript: |
                      set -euo pipefail
                      SWA_TOKEN="$(
                        az staticwebapp secrets list \
                          --name sticker \
                          --resource-group custom-stickers \
                          --query properties.apiKey \
                          --output tsv
                      )"
                      test -n "${SWA_TOKEN}"
                      echo "::add-mask::${SWA_TOKEN}"
                      echo "SWA_DEPLOYMENT_TOKEN=${SWA_TOKEN}" >> "${GITHUB_ENV}"
            - name: "Deploy to Static Web Apps"
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ env.SWA_DEPLOYMENT_TOKEN }}
                  action: upload
                  app_location: www
                  skip_app_build: true

            - name: logout
              run: az logout
              if: always()
